<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-labelledby="t">
  <title id="t">Tech stack: GPT API, LangChain, LangGraph, RAG, Docling, Chroma, Streamlit</title>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#14211C" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="230" rx="24"/></clipPath>
    <style>
      .sans { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", monospace; }
      .tile { fill: #0F1915; stroke: #22332B; stroke-width: 1.2; }
      .name { fill: #F2F7F4; font-size: 16px; font-weight: 700; }
      .role { fill: #8FA39A; font-size: 11.5px; }
      .bar  { animation: glow 3.5s ease-in-out infinite; }
      @keyframes glow { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .bar { animation: none; opacity: .9; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="230" fill="#0A100E"/>
    <rect width="1200" height="230" fill="url(#grid)" opacity=".7"/>

    <text x="32" y="44" class="mono" font-size="12" fill="#5E7268">tech stack</text>
    <text x="1168" y="44" class="mono" font-size="12" fill="#5E7268" text-anchor="end">python 3.11+</text>

    <!-- 1 GPT API -->
    <g transform="translate(32 70)">
      <rect class="tile" width="150" height="130" rx="14"/>
      <rect class="bar" x="16" y="0" width="118" height="3" rx="1.5" fill="#10A37F" style="animation-delay:0s"/>
      <g transform="translate(16 18)">
        <rect width="44" height="44" rx="12" fill="#10A37F" fill-opacity=".14"/>
        <path d="M22 6 C24 16 28 20 38 22 C28 24 24 28 22 38 C20 28 16 24 6 22 C16 20 20 16 22 6Z" fill="#10A37F"/>
      </g>
      <text class="name sans" x="16" y="94">GPT API</text>
      <text class="role sans" x="16" y="114">LLM + embeddings</text>
    </g>

    <!-- 2 LangChain -->
    <g transform="translate(196 70)">
      <rect class="tile" width="150" height="130" rx="14"/>
      <rect class="bar" x="16" y="0" width="118" height="3" rx="1.5" fill="#2DD4BF" style="animation-delay:.5s"/>
      <g transform="translate(16 18)">
        <rect width="44" height="44" rx="12" fill="#2DD4BF" fill-opacity=".14"/>
        <g fill="none" stroke="#2DD4BF" stroke-width="3">
          <rect x="6" y="16" width="20" height="12" rx="6"/>
          <rect x="18" y="16" width="20" height="12" rx="6"/>
        </g>
      </g>
      <text class="name sans" x="16" y="94">LangChain</text>
      <text class="role sans" x="16" y="114">tools · loaders</text>
    </g>

    <!-- 3 LangGraph -->
    <g transform="translate(360 70)">
      <rect class="tile" width="150" height="130" rx="14"/>
      <rect class="bar" x="16" y="0" width="118" height="3" rx="1.5" fill="#A78BFA" style="animation-delay:1s"/>
      <g transform="translate(16 18)">
        <rect width="44" height="44" rx="12" fill="#A78BFA" fill-opacity=".14"/>
        <g stroke="#A78BFA" stroke-width="2.4">
          <path d="M22 12 L11 32 M22 12 L33 32 M11 32 H33"/>
        </g>
        <circle cx="22" cy="12" r="5" fill="#A78BFA"/>
        <circle cx="11" cy="32" r="5" fill="#A78BFA"/>
        <circle cx="33" cy="32" r="5" fill="#A78BFA"/>
      </g>
      <text class="name sans" x="16" y="94">LangGraph</text>
      <text class="role sans" x="16" y="114">agent graph</text>
    </g>

    <!-- 4 RAG -->
    <g transform="translate(524 70)">
      <rect class="tile" width="150" height="130" rx="14" style="stroke:#2F6B4F"/>
      <rect class="bar" x="16" y="0" width="118" height="3" rx="1.5" fill="#3DDC84" style="animation-delay:1.5s"/>
      <g transform="translate(16 18)">
        <rect width="44" height="44" rx="12" fill="#3DDC84" fill-opacity=".14"/>
        <g fill="none" stroke="#3DDC84" stroke-width="3" stroke-linecap="round">
          <circle cx="19" cy="19" r="9"/>
          <path d="M26 26 L35 35"/>
        </g>
      </g>
      <text class="name sans" x="16" y="94">RAG</text>
      <text class="role sans" x="16" y="114">grounded answers</text>
    </g>

    <!-- 5 Docling -->
    <g transform="translate(688 70)">
      <rect class="tile" width="150" height="130" rx="14"/>
      <rect class="bar" x="16" y="0" width="118" height="3" rx="1.5" fill="#F5B342" style="animation-delay:2s"/>
      <g transform="translate(16 18)">
        <rect width="44" height="44" rx="12" fill="#F5B342" fill-opacity=".14"/>
        <g fill="none" stroke="#F5B342" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
          <path d="M12 8 H26 L33 15 V36 H12 Z"/>
          <path d="M26 8 V15 H33"/>
          <path d="M17 23 H28 M17 29 H25"/>
        </g>
      </g>
      <text class="name sans" x="16" y="94">Docling</text>
      <text class="role sans" x="16" y="114">PDF · DOCX parsing</text>
    </g>

    <!-- 6 Chroma -->
    <g transform="translate(852 70)">
      <rect class="tile" width="150" height="130" rx="14"/>
      <rect class="bar" x="16" y="0" width="118" height="3" rx="1.5" fill="#FF8A65" style="animation-delay:2.5s"/>
      <g transform="translate(16 18)">
        <rect width="44" height="44" rx="12" fill="#FF8A65" fill-opacity=".14"/>
        <circle cx="17" cy="18" r="9" fill="#FF6B6B" fill-opacity=".85"/>
        <circle cx="27" cy="18" r="9" fill="#FFD166" fill-opacity=".75"/>
        <circle cx="22" cy="27" r="9" fill="#4D96FF" fill-opacity=".75"/>
      </g>
      <text class="name sans" x="16" y="94">Chroma</text>
      <text class="role sans" x="16" y="114">vector store</text>
    </g>

    <!-- 7 Streamlit -->
    <g transform="translate(1016 70)">
      <rect class="tile" width="150" height="130" rx="14"/>
      <rect class="bar" x="16" y="0" width="118" height="3" rx="1.5" fill="#FF4B4B" style="animation-delay:3s"/>
      <g transform="translate(16 18)">
        <rect width="44" height="44" rx="12" fill="#FF4B4B" fill-opacity=".14"/>
        <path d="M8 32 L22 12 L36 32 Z" fill="#FF4B4B" fill-opacity=".9"/>
        <path d="M14 32 L22 21 L30 32 Z" fill="#0F1915"/>
      </g>
      <text class="name sans" x="16" y="94">Streamlit</text>
      <text class="role sans" x="16" y="114">chat UI</text>
    </g>

    <rect x=".75" y=".75" width="1198.5" height="228.5" rx="23.5" fill="none" stroke="#1F2E27" stroke-width="1.5"/>
  </g>
</svg>
